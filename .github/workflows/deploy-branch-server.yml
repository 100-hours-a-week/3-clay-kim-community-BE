name: Deploy Branch to Server

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '배포할 브랜치명'
        required: true
        default: 'dev'
      run_tests:
        description: '배포 전 테스트 실행'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-branch-server
  cancel-in-progress: false

env:
  BACKEND_APP_DIR: ${{ vars.BACKEND_APP_DIR || '/opt/community/V1/docker/app' }}
  IMAGE_PLATFORM: linux/arm64

jobs:
  deploy-branch:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:8080/api/actuator/health' }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Test
        if: ${{ inputs.run_tests }}
        run: ./gradlew clean test --console=plain

      - name: Build with Gradle
        run: ./gradlew build -x test --console=plain

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SAFE_BRANCH="$(printf '%s' "${{ inputs.branch }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-80)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="manual-${SAFE_BRANCH}-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"

          {
            echo "short_sha=${SHORT_SHA}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image_uri=${IMAGE_NAME}:${IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.IMAGE_PLATFORM }}
          tags: ${{ steps.meta.outputs.image_uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/community_deploy_key
          chmod 600 ~/.ssh/community_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload deploy files
        shell: bash
        run: |
          set -euo pipefail

          SSH_TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          REMOTE_DIR="$(printf '%q' "$BACKEND_APP_DIR")"
          ssh -i ~/.ssh/community_deploy_key -p "$DEPLOY_PORT" "$SSH_TARGET" "mkdir -p ${REMOTE_DIR}"
          scp -i ~/.ssh/community_deploy_key -P "$DEPLOY_PORT" \
            deploy/deploy.sh deploy/compose.app.yaml deploy/Caddyfile \
            "$SSH_TARGET:$BACKEND_APP_DIR/"
          ssh -i ~/.ssh/community_deploy_key -p "$DEPLOY_PORT" "$SSH_TARGET" "chmod +x ${REMOTE_DIR}/deploy.sh"

      - name: Deploy backend
        shell: bash
        env:
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
        run: |
          set -euo pipefail

          SSH_TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          REMOTE_DIR="$(printf '%q' "$BACKEND_APP_DIR")"

          {
            printf 'export BACKEND_IMAGE=%q\n' "$IMAGE_URI"
            printf 'export GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'export HEALTH_URL=%q\n' "$HEALTH_URL"
            printf 'exec ./deploy.sh backend %q\n' "$IMAGE_URI"
          } | ssh -i ~/.ssh/community_deploy_key -p "$DEPLOY_PORT" "$SSH_TARGET" \
            "cd ${REMOTE_DIR} && bash -s"

      - name: Deployment summary
        run: |
          {
            echo "### Branch deployment"
            echo "- Branch: \`${{ inputs.branch }}\`"
            echo "- Commit: \`${{ steps.meta.outputs.short_sha }}\`"
            echo "- Image: \`${{ steps.meta.outputs.image_uri }}\`"
            echo "- Tests: \`${{ inputs.run_tests }}\`"
            echo "- Transport: \`SSH\`"
          } >> "$GITHUB_STEP_SUMMARY"
